    <script>
        const canvas = document.getElementById('digital-rain-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const lineWidth = 2; 
        const spacing = 24; 
        const columns = Math.floor(canvas.width / spacing);
        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = Math.random() * -canvas.height;
        }

        const speed = 4;
        const dropLength = 60; 

        function drawDigitalLines() {
            ctx.fillStyle = 'rgba(11, 12, 12, 0.12)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = lineWidth;
            
            for (let i = 0; i < rainDrops.length; i++) {
                const xPosition = i * spacing;
                const yPosition = rainDrops[i];

                ctx.beginPath();
                ctx.moveTo(xPosition, yPosition - dropLength);
                ctx.lineTo(xPosition, yPosition);
                
                ctx.strokeStyle = 'rgba(132, 255, 144, 0.45)'; 
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#84FF90';
                ctx.stroke();

                rainDrops[i] += speed;

                if (rainDrops[i] > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
            }
            ctx.shadowBlur = 0;
            requestAnimationFrame(drawDigitalLines);
        }
        requestAnimationFrame(drawDigitalLines);

           function showPortal(id) {

    // 2. CORREÇÃO DE SELEÇÃO: Encontra o botão físico (p1 a p5) dentro da estrela correta
       // 2. CORREÇÃO MATEMÁTICA: Converte o ID do relógio para as classes físicas reais p1-p5

        }
        
        // Aplica a cor de fundo e a tripla sombra néon de retroiluminação
        activeCorner.style.setProperty('background-color', neonColor, 'important');
        activeCorner.style.setProperty('border-color', 'rgba(255, 255, 255, 0.6)', 'important');
        
        // Brilho exterior néon + Iluminação interior suave + Iluminação interior forte da marca
        activeCorner.style.setProperty('box-shadow', 
            `0 0 25px ${neonColor}, inset 0 0 14px rgba(255, 255, 255, 0.5), inset 0 0 20px ${neonColor}`,

        );
