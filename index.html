    <script>
        const canvas = document.getElementById('digital-rain-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        const lineWidth = 2; 
        const spacing = 24; 
        const columns = Math.floor(canvas.width / spacing);
        const rainDrops = [];
        for (let x = 0; x < columns; x++) {
            rainDrops[x] = Math.random() * -canvas.height;
        }

        const speed = 4;
        const dropLength = 60; 

        function drawDigitalLines() {
            ctx.fillStyle = 'rgba(11, 12, 12, 0.12)'; 
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.lineWidth = lineWidth;
            
            for (let i = 0; i < rainDrops.length; i++) {
                const xPosition = i * spacing;
                const yPosition = rainDrops[i];

                ctx.beginPath();
                ctx.moveTo(xPosition, yPosition - dropLength);
                ctx.lineTo(xPosition, yPosition);
                
                ctx.strokeStyle = 'rgba(132, 255, 144, 0.45)'; 
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#84FF90';
                ctx.stroke();

                rainDrops[i] += speed;

                if (rainDrops[i] > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
            }
            ctx.shadowBlur = 0;
            requestAnimationFrame(drawDigitalLines);
        }
        requestAnimationFrame(drawDigitalLines);

         // NEFERTIRI DIAL DRAG-TO-ROTATE (Mouse + Touch)
  (function() {
    const dial = document.getElementById('hub-dial');
    const wheel = document.getElementById('dial-wheel');
    const label = document.getElementById('hub-label');
    if (!dial || !wheel) return;

    let isDragging = false;
    let wasDragged = false;
    let startAngle = 0;
    let currentRotation = 0;
    let isUnlocked = false;

    function getAngle(clientX, clientY) {
        const rect = dial.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height / 2;
        return Math.atan2(clientY - centerY, clientX - centerX) * (180 / Math.PI);
    }

    dial.addEventListener('pointerdown', (e) => {
        if (isUnlocked) return;
        e.preventDefault();
        isDragging = true;
        wasDragged = false;
        dial.classList.add('dragging');
        try { dial.setPointerCapture(e.pointerId); } catch (err) {}
        startAngle = getAngle(e.clientX, e.clientY) - currentRotation;
    });

    dial.addEventListener('pointermove', (e) => {
        if (!isDragging || isUnlocked) return;
        const newAngle = getAngle(e.clientX, e.clientY) - startAngle;
        if (Math.abs(newAngle - currentRotation) > 3) {
            wasDragged = true;
        }
        currentRotation = newAngle;
        wheel.style.transform = `rotate(${currentRotation}deg)`;

        let normalized = ((currentRotation + 180) % 360) - 180;
        if (Math.abs(normalized) >= 36) {
            isUnlocked = true;
            isDragging = false;
            dial.classList.remove('dragging');
            dial.classList.add('unlocked');
            wheel.style.transform = `rotate(${normalized > 0 ? 36 : -36}deg)`;
            if (label) label.textContent = "UNLOCKED";
            setTimeout(() => {
                window.location.href = "hub/";
            }, 450);
        }
    });

    function stopDrag(e) {
        if (!isDragging || isUnlocked) return;
        isDragging = false;
        dial.classList.remove('dragging');
        try { dial.releasePointerCapture(e.pointerId); } catch (err) {}
        currentRotation = 0;
        wheel.style.transform = `rotate(0deg)`;
    }

    dial.addEventListener('pointerup', stopDrag);
    dial.addEventListener('pointercancel', stopDrag);

    if (label) {
        label.addEventListener('click', (e) => {
            if (wasDragged) e.preventDefault();
        });
    }

    window.addEventListener('pageshow', () => {
        isUnlocked = false;
        isDragging = false;
        wasDragged = false;
        currentRotation = 0;
        dial.classList.remove('dragging', 'unlocked');
        wheel.style.transform = 'rotate(0deg)';
        if (label) label.textContent = 'HUB';
    });
})();
