<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HUB // Hugo Miguel libre</title>
  <style>
    body {
      margin: 0;
      background-color: #0b0c0c;
      color: #CAC9CF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 20px;
    }
    img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      mix-blend-mode: screen;
      margin-bottom: 20px;
    }
    h1 {
      color: #E5A93C;
      font-size: 1.4rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    p {
      color: #5CE0E9;
      font-size: 0.92rem;
      max-width: 380px;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    a {
      color: #84FF90;
      text-decoration: none;
      border: 1px solid #84FF90;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 0.82rem;
      letter-spacing: 0.08em;
      transition: all 0.25s ease;
    }
    a:hover {
      background: #84FF90;
      color: #0b0c0c;
    }
  </style>
</head>
<body>
  <img src="../logo.png" alt="Logo" />
  <h1>The Visual Hub</h1>
  <p>The inner chamber is currently being mapped. Return soon to explore the visual field guide.</p>
  <a href="../">← Return to Station</a>
</body>
</html>
